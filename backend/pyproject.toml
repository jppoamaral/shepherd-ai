[project]
name = "shepherd"
version = "0.1.0"
description = "Shepherd: church volunteer coordination"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "openai>=1.50",
    "ortools>=9.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app", "seeds"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*"]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
