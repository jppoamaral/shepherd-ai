<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--cream);}
.wrap{position:relative;width:960px;height:288px;overflow:hidden;background:var(--cream)}
.name{position:absolute;left:32px;bottom:40px;width:440px;}
.name h1{margin:0;font-family:var(--font-serif);font-weight:500;font-size:96px;line-height:.95;color:var(--forest);letter-spacing:-.01em}
.name p{margin:12px 0 0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
svg{position:absolute;left:0;top:0}
.forest{fill:var(--forest)}.sage{fill:var(--sage)}.gold{fill:var(--gold)}.paper{fill:var(--paper)}.cream{fill:var(--cream)}.dot{fill:var(--cream)}
.blk-a{rx:var(--radius-lg)}
</style></head><body><div class="wrap">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: forest 240x192 (space-5 multiples), sage 224x120 bleeding right, gold arch 120x152 bleeding bottom, sage pill 240x80. arrangement: staggered stack right of x=480. pattern: soft, friendly, large radii (warm, pastoral) -> a grid of 24 discs at 32px pitch cut from the forest block. radii: radius-lg 20, pills at half the short side. -->
<rect class="forest blk-a" x="496" y="0" width="240" height="192" rx="20" ry="20"/>
<rect class="sage" x="752" y="0" width="208" height="120" rx="20" ry="20"/>
<rect class="gold" x="752" y="136" width="120" height="152" rx="60" ry="60"/>
<rect class="sage" x="496" y="208" width="240" height="80" rx="40" ry="40"/>

</svg>
<div class="name"><h1>Shepherd</h1><p>Shepherd suggests, the leader decides.</p></div>
</div></body></html>
